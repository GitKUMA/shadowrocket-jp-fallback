# Shadowrocket Japanese node failover; no nodes or subscription credentials.
# Import and activate this configuration, then use Configuration routing.
[General]
update-url = https://raw.githubusercontent.com/GitKUMA/shadowrocket-jp-fallback/main/jp-fallback.conf

[Proxy Group]
日本故障转移 = fallback,policy-regex-filter=(?i)^(?!.*(?:剩余|到期|官网|下载|更新订阅|自动更新|congyu\.org|永久地址|丛雨云))(?=.*(?:🇯🇵|日本|\bJapan\b)).*$,interval=15,timeout=3,url=https://www.gstatic.com/generate_204

[Rule]
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
GEOIP,CN,DIRECT
FINAL,日本故障转移

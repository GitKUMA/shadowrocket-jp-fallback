# This file intentionally contains no traffic rules.
[General]
update-url = https://raw.githubusercontent.com/GitKUMA/shadowrocket-jp-fallback/main/jp-fallback-group.conf

[Proxy Group]
日本故障转移 = fallback,policy-regex-filter=(?i)^(?!.*(?:剩余|到期|官网|下载|更新订阅|自动更新|congyu\.org|永久地址|丛雨云))(?=.*(?:🇯🇵|日本|\bJapan\b)).*$,interval=15,timeout=3,url=https://www.gstatic.com/generate_204
